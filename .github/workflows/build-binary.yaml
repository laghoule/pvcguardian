name: Build and Release Binary

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target release tag to attach binaries to (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Version
        id: resolve
        run: |
          set -euo pipefail

          CHART_FILE="deploy/chart/pvcguardian/Chart.yaml"
          CHART_VERSION="$(awk -F': *' '/^version:/{gsub(/"/,"",$2); print $2}' "${CHART_FILE}" | tr -d '[:space:]')"
          APP_VERSION="$(awk -F': *' '/^appVersion:/{gsub(/"/,"",$2); print $2}' "${CHART_FILE}" | tr -d '[:space:]')"

          if [[ -z "${APP_VERSION}" ]]; then
            echo "::error::Unable to read appVersion from ${CHART_FILE}"
            exit 1
          fi
          if [[ "${CHART_VERSION}" != "${APP_VERSION}" ]]; then
            echo "::warning::Chart version (${CHART_VERSION}) differs from appVersion (${APP_VERSION})"
          fi

          RELEASE="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
            RELEASE="true"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            RELEASE="true"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          else
            VERSION="v${APP_VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
              echo "Tag ${VERSION} already exists, no release needed"
            else
              echo "Tag ${VERSION} does not exist, a release will be published"
              RELEASE="true"
            fi
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release=${RELEASE}" >> "${GITHUB_OUTPUT}"

  test:
    name: Run Tests & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

  build-binary:
    name: Compile Multi-Arch Binaries
    needs: [test, version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Set Version Metadata
        id: meta
        run: |
          echo "version=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          OUTPUT_NAME="pvcguardian-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p dist
          go build \
            -ldflags="-s -w -X main.version=${{ steps.meta.outputs.version }} -X main.commit=${{ steps.meta.outputs.commit }} -X main.date=${{ steps.meta.outputs.date }}" \
            -o "dist/${OUTPUT_NAME}" \
            ./cmd/pvcguardian
          cd dist && sha256sum "${OUTPUT_NAME}" > "${OUTPUT_NAME}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 5

  release:
    name: Publish GitHub Release
    if: needs.version.outputs.release == 'true'
    needs: [version, build-binary]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: binary-*
          merge-multiple: true

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Container Image to GHCR
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Build Date
        id: date
        run: echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.release == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.date }}
