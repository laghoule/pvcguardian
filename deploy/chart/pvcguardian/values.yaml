replicaCount: 1 # Must stay 1: PVCGuardian has no leader election yet.

image:
  repository: ghcr.io/laghoule/pvcguardian
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is "v" + the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources: {}
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 50m
  #   memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

config:
  discovery:
    requirePVC: true
    defaultPreset: evening
    excludeNamespaces:
      - kube-system

  velero:
    namespace: velero
    storageLocation: ""
    defaultVolumesToFsBackup: true

  schedules:
    timezone: UTC # Only UTC is supported; Velero cron expressions are UTC-based.
    retention: 5d
    windows:
      day:
        from: "10:00"
        to: "16:00"
      evening:
        from: "20:00"
        to: "23:00"
      night:
        from: "01:00"
        to: "04:00"
    cron: {}

  reconcile:
    interval: 15m

  logging:
    level: info
    format: json

  metrics:
    enabled: true
    addr: ":8080"

podMonitor:
  enabled: false
  namespace: "" # defaults to release namespace
  interval: "30s"
  scrapeTimeout: "10s"
  labels: {}
  annotations: {}
  metricRelabelings: []
  relabelings: []

prometheusRule:
  enabled: false
  namespace: "" # defaults to release namespace
  labels: {}
  annotations: {}

dashboard:
  enabled: true
  namespace: "" # defaults to release namespace
  labels:
    grafana_dashboard: "1" # automatically imported by grafana-sidecar if enabled
  annotations: {}
