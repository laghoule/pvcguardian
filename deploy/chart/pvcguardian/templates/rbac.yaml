apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pvcguardian.fullname" . }}
  labels:
    {{- include "pvcguardian.labels" . | nindent 4 }}
rules:
  # Scannable namespace discovery
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

  # Workload discovery for backup units (Deployment, StatefulSet, DaemonSet)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]

  # Workload discovery for Batch workloads (CronJobs, Jobs)
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]

  # PVC association & coverage checks
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pvcguardian.fullname" . }}
  labels:
    {{- include "pvcguardian.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pvcguardian.fullname" . }}
  subjects:
  - kind: ServiceAccount
    name: {{ include "pvcguardian.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Velero Schedules lifecycle management restricted to the configured Velero namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pvcguardian.fullname" . }}-velero
  namespace: {{ .Values.config.velero.namespace }}
  labels:
    {{- include "pvcguardian.labels" . | nindent 4 }}
rules:
  - apiGroups: ["velero.io"]
    resources: ["schedules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pvcguardian.fullname" . }}-velero
  namespace: {{ .Values.config.velero.namespace }}
  labels:
    {{- include "pvcguardian.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pvcguardian.fullname" . }}-velero
subjects:
  - kind: ServiceAccount
    name: {{ include "pvcguardian.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
