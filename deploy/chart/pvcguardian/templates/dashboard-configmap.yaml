{{- if .Values.dashboard.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pvcguardian.fullname" . }}-dashboard
  namespace: {{ default .Release.Namespace .Values.dashboard.namespace }}
  labels:
    {{- include "pvcguardian.labels" . | nindent 4 }}
    {{- with .Values.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  pvcguardian.json: |-
{{ .Files.Get "dashboards/pvcguardian.json" | indent 4 }}
{{- end }}
