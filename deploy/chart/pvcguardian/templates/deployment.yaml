{{- $metricsPort := splitList ":" .Values.config.metrics.addr | last }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pvcguardian.fullname" . }}
  labels:
    {{- include "pvcguardian.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Only the replica holding the leader-election lease reconciles Schedules, so
  # a rolling update can run two pods without both writing concurrently.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pvcguardian.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pvcguardian.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pvcguardian.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" (trimPrefix "v" .Chart.AppVersion)) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - "--config=/etc/pvcguardian/config.yaml"
          env:
            # Leader election inherits its coordinates from the Deployment. Not
            # user configuration: the lease is named after the Deployment and
            # lives in the namespace where PVCGuardian is installed.
            - name: PVCGUARDIAN_LEASE_NAME
              value: {{ include "pvcguardian.fullname" . | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- if .Values.config.metrics.enabled }}
          ports:
            # Keep the probe target aligned with config.metrics.addr.
            - name: metrics
              containerPort: {{ $metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/pvcguardian
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "pvcguardian.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
